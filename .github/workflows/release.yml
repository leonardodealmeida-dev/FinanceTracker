
name: Build and release

# Build installers for Windows, macOS and Linux
# and attach them to a GitHub release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Tag must match app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".")
          from app.version import __version__

          tag = os.environ["GITHUB_REF_NAME"]

          if tag != f"v{__version__}":
              sys.exit(
                  f"Tag {tag} does not match app/version.py ({__version__})"
              )
          PY

  build:
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows

          - os: macos-latest
            name: macos

          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bake in Supabase settings (publishable key only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tools/write_bundled_config.py

      - name: Build app
        run: pyinstaller packaging/FinanceTracker.spec --noconfirm

      - name: Read version
        id: ver
        shell: bash
        run: |
          echo "version=$(python -c 'from app.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      # Windows installer
      - name: Windows installer (Inno Setup)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss

      - name: Windows ZIP
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FinanceTracker -DestinationPath "dist\FinanceTracker-${{ steps.ver.outputs.version }}-windows.zip"

      # macOS disk image
      - name: macOS DMG and ZIP
        if: matrix.name == 'macos'
        run: |
          hdiutil create -volname FinanceTracker \
            -srcfolder dist/FinanceTracker.app -ov -format UDZO \
            "dist/FinanceTracker-${{ steps.ver.outputs.version }}-macos-arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent dist/FinanceTracker.app \
            "dist/FinanceTracker-${{ steps.ver.outputs.version }}-macos-arm64.zip"

      # Linux archive
      - name: Linux TAR.GZ
        if: matrix.name == 'linux'
        run: |
          cp assets/icon.png dist/FinanceTracker/icon.png
          tar -C dist -czf "dist/FinanceTracker-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" FinanceTracker

      # Upload generated files
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinanceTracker-${{ matrix.name }}
          path: |
            dist/*-windows-setup.exe
            dist/*-windows.zip
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/*
