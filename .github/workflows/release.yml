name: Build and release

# Push a tag like v1.0.0 to build installers for Windows, macOS and Linux
# and attach them to a DRAFT GitHub release (review it, then publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests -q
      - name: Tag must match app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from app.version import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"Tag {tag} does not match app/version.py ({__version__})")
          PY

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest        # Apple Silicon
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bake in Supabase settings (publishable key only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tools/write_bundled_config.py

      - name: Build app
        run: pyinstaller packaging/FinanceTracker.spec --noconfirm

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from app.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      # ---- Windows installer ----
      - name: Windows installer (Inno Setup)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss

      # ---- macOS disk image (unsigned) ----
      - name: macOS .dmg
        if: matrix.name == 'macos'
        run: |
          hdiutil create -volname FinanceTracker \
            -srcfolder dist/FinanceTracker.app -ov -format UDZO \
            "dist/FinanceTracker-${{ steps.ver.outputs.version }}-macos-arm64.dmg"

      # ---- Linux archive ----
      - name: Linux .tar.gz
        if: matrix.name == 'linux'
        run: |
          cp assets/icon.png dist/FinanceTracker/icon.png
          tar -C dist -czf "dist/FinanceTracker-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" FinanceTracker

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceTracker-${{ matrix.name }}
          path: |
            dist/*-windows-setup.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
